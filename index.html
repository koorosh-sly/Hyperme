<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هایپرمی — تخفیف‌های ویژه</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>هایپرمی</h1>
    <p class="tagline">تخفیف‌های ویژه امروز</p>
  </header>

  <main class="products">

    <article class="card">
      <div class="badge">۵۰٪ تخفیف</div>
      <div class="card-icon">🍯</div>
      <h2 class="card-title">عسل کوهستان</h2>
      <div class="pricing">
        <span class="old-price">۲٬۲۵۰٬۰۰۰ تومان</span>
        <span class="new-price">۱٬۱۲۵٬۰۰۰ تومان</span>
      </div>
    </article>

    <article class="card">
      <div class="badge">۴۵٪ تخفیف</div>
      <div class="card-icon">🔋</div>
      <h2 class="card-title">باتری قلمی</h2>
      <div class="pricing">
        <span class="old-price">۹۴٬۵۰۰ تومان</span>
        <span class="new-price">۵۲٬۰۰۰ تومان</span>
      </div>
    </article>

  </main>

  <footer class="site-footer">
    <img
      class="qr-code"
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://koorosh-sly.github.io/Hyperme/"
      alt="QR Code هایپرمی"
      width="100"
      height="100"
    />
    <p>koorosh-sly.github.io/Hyperme</p>
  </footer>
</body>
</html>
